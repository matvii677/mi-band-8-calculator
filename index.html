<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Band 8 — Calculator</title>
<style>
:root{color-scheme:dark;--accent:#caff45;--screen:#050606;--muted:#777b7d;--key:#191c1d;--key2:#252929}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;background:radial-gradient(ellipse at 50% 38%,#252a2a,#0c0f0f 63%,#060707);color:#f7f8f4;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:13px;letter-spacing:.17em;color:#a3aaa6;text-transform:uppercase;margin:0}.subtitle{font-size:11px;color:#6d7470;margin:0}
.watch{position:relative;width:252px;height:520px;display:grid;place-items:center}.strap{position:absolute;width:150px;height:520px;border-radius:52px;background:linear-gradient(90deg,#181b1b,#343939 22%,#191c1c 49%,#313636 72%,#111313);box-shadow:inset 0 0 0 1px #424747,0 18px 40px #0009}.strap:before,.strap:after{content:"";position:absolute;left:53px;width:44px;height:13px;border-radius:8px;background:#080909;border:1px solid #353a3a}.strap:before{top:36px}.strap:after{bottom:36px}
.case{position:relative;width:232px;height:456px;padding:8px;border-radius:42px;background:linear-gradient(135deg,#5a6161,#131515 25%,#303636 55%,#101212 85%,#555b5b);box-shadow:inset 0 0 0 2px #252929,0 20px 40px #000c}.case:after{content:"";position:absolute;right:-3px;top:140px;width:4px;height:52px;border-radius:0 4px 4px 0;background:linear-gradient(#737a79,#272b2b,#646a69)}
.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:34px;background:var(--screen);box-shadow:inset 0 0 0 1px #202424}.view{position:absolute;inset:0;padding:12px 11px 14px;display:flex;flex-direction:column}.view[hidden]{display:none}
.status{height:18px;flex:none;display:flex;align-items:center;justify-content:space-between;font-size:9px;font-weight:700;letter-spacing:.08em;color:#737b77}.right{display:flex;align-items:center;gap:5px}.battery{position:relative;width:14px;height:7px;border:1px solid #79807b;border-radius:2px}.battery:before{content:"";position:absolute;top:1px;left:2px;width:8px;height:3px;background:var(--accent);border-radius:1px}.battery:after{content:"";position:absolute;right:-3px;top:1px;width:2px;height:3px;background:#79807b}
.clock-block{margin-top:52px;text-align:center}.clock{font-variant-numeric:tabular-nums;font-size:47px;line-height:1;letter-spacing:-2.6px;font-weight:620}.seconds{margin-top:3px;color:var(--accent);font-size:13px;letter-spacing:.15em;font-weight:700;font-variant-numeric:tabular-nums}.date{margin-top:12px;font-size:9px;color:#858d88;letter-spacing:.045em}.divider{margin-top:30px;height:1px;background:#202525}.note{margin-top:15px;text-align:center;color:#707773;font-size:9px;letter-spacing:.13em;text-transform:uppercase}
.launch{margin-top:auto;height:48px;flex:none;border:1px solid #d8ff7d;border-radius:17px;background:var(--accent);color:#10140a;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:850;font-size:13px;letter-spacing:.02em;cursor:pointer}.launch svg{width:17px;height:17px}
.calc{padding:10px 9px 14px}.calc-head{height:31px;flex:none;display:flex;align-items:center;gap:7px;margin-top:2px}.back{width:29px;height:28px;flex:none;display:grid;place-items:center;border:1px solid #2b3030;border-radius:9px;background:#131616;color:#c1c7c3;cursor:pointer}.back svg{width:15px;height:15px}.title{font-size:12px;font-weight:800;letter-spacing:.03em}.tag{margin-left:auto;color:#747c78;font-size:8px;letter-spacing:.1em}
.display{margin-top:9px;min-height:91px;flex:none;padding:10px;border:1px solid #252a2a;border-radius:15px;background:linear-gradient(145deg,#131616,#090b0b);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.expression{min-height:18px;text-align:right;color:#7d8581;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.result{font-size:30px;line-height:1.15;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:clip;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.key-area{display:grid;grid-template-columns:minmax(0,1fr) 39px;gap:6px;margin-top:10px;flex:none}.numbers,.ops{display:grid;grid-template-rows:repeat(4,39px);gap:6px}.numbers{grid-template-columns:repeat(3,minmax(0,1fr))}.key{min-width:0;padding:0;border:1px solid #282d2d;border-radius:12px;background:var(--key);color:#f1f4ef;font-size:17px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s}.key:active,.launch:active,.back:active{transform:scale(.96)}.utility{font-size:12px;font-weight:800;color:#bdc5bf;background:var(--key2)}.op{border-color:#4b5a31;background:#1a2112;color:var(--accent);font-size:19px}.op.selected{background:var(--accent);color:#11150c}.equals{background:var(--accent);border-color:var(--accent);color:#10140a;font-size:20px;font-weight:850}
.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;height:36px;margin-top:6px;flex:none}.bottom .key{border-radius:11px}.bottom .utility{color:var(--accent)}.hint{margin-top:auto;padding-top:7px;text-align:center;font-size:8px;color:#5f6762}.indicator{position:absolute;z-index:3;bottom:5px;left:50%;transform:translateX(-50%);width:44px;height:3px;background:#e8ece5;border-radius:3px;opacity:.7;pointer-events:none}
.caption{max-width:310px;margin:0;text-align:center;font-size:11px;line-height:1.5;color:#89918c}.caption strong{color:#d6ddd6}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}@media(max-height:650px){body{padding:8px;gap:8px}.watch{transform:scale(.86);margin:-32px 0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>Mi Band 8 · concept</h1><p class="subtitle">інтерактивний прототип екрана</p>
<main class="watch" aria-label="Макет годинника Mi Band 8"><div class="strap" aria-hidden="true"></div><div class="case"><div class="screen">
<section id="home" class="view" aria-label="Головний екран">
<div class="status"><span>MI BAND 8</span><span class="right"><span>98%</span><span class="battery"></span></span></div>
<div class="clock-block"><div id="clock" class="clock">00:00</div><div id="seconds" class="seconds">:00</div><div id="date" class="date">СЬОГОДНІ</div></div>
<div class="divider"></div><div class="note">tap to calculate</div>
<button id="open" class="launch" type="button" aria-label="Відкрити калькулятор"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7h7M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>calculator</button>
</section>
<section id="calc" class="view calc" aria-label="Калькулятор" hidden>
<div class="status"><span>MI BAND 8</span><span class="right"><span>98%</span><span class="battery"></span></span></div>
<div class="calc-head"><button id="back" class="back" type="button" aria-label="Назад до годинника"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6M9 12h11"/></svg></button><span class="title">Calculator</span><span class="tag">BASIC</span></div>
<div class="display" aria-live="polite"><div id="expr" class="expression">READY</div><div id="out" class="result">0</div></div>
<div class="key-area"><div class="numbers">
<button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button>
<button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button>
<button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button>
<button class="key utility" data-a="sign">+/−</button><button class="key" data-v="0">0</button><button class="key" data-v=".">.</button>
</div><div class="ops"><button class="key op" data-op="/" aria-label="Поділити">÷</button><button class="key op" data-op="*" aria-label="Помножити">×</button><button class="key op" data-op="-" aria-label="Відняти">−</button><button class="key op" data-op="+" aria-label="Додати">+</button></div></div>
<div class="bottom"><button class="key utility" data-a="clear" aria-label="Очистити">C</button><button class="key utility" data-a="del" aria-label="Видалити останню цифру">⌫</button><button class="key equals" data-a="equals" aria-label="Дорівнює">=</button></div>
<div class="hint">tap a key · C to clear</div>
</section><div class="indicator" aria-hidden="true"></div>
</div></div></main>
<p class="caption"><strong>Прототип для браузера.</strong> Натисни calculator, щоб спробувати калькулятор. Це демонстрація дизайну, не прошивка для встановлення на браслет.</p>
<script>
(() => {
 const $=id=>document.getElementById(id), home=$('home'), calc=$('calc'), exprEl=$('expr'), out=$('out');
 let expression='', evaluated=false, previous='';
 const pad=n=>String(n).padStart(2,'0');
 function tick(){const d=new Date();$('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());$('seconds').textContent=':'+pad(d.getSeconds());$('date').textContent=new Intl.DateTimeFormat('uk-UA',{weekday:'long',day:'numeric',month:'long'}).format(d).replace(',','').toLocaleUpperCase('uk-UA')}
 tick();setInterval(tick,250);
 function nice(s){return s.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−')}
 function calculate(s){
   const tokens=s.match(/(?:\d+(?:\.\d*)?|\.\d+)|[+\-*/]/g)||[];
   if(!tokens.length||tokens.join('')!==s.replace(/\s/g,''))throw Error('invalid');
   let i=0;
   function factor(){if(tokens[i]==='+'){i++;return factor()}if(tokens[i]==='-'){i++;return-factor()}const t=tokens[i++];if(t===undefined||/^[+\-*/]$/.test(t))throw Error('number');const n=Number(t);if(!Number.isFinite(n))throw Error('number');return n}
   function term(){let n=factor();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],r=factor();if(op==='/'&&r===0)throw Error('zero');n=op==='*'?n*r:n/r}return n}
   function sum(){let n=term();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],r=term();n=op==='+'?n+r:n-r}return n}
   const n=sum();if(i!==tokens.length||!Number.isFinite(n))throw Error('invalid');return n
 }
 function format(n){if(!Number.isFinite(n))throw Error('invalid');return String(Math.abs(n)<1e-10?0:Number(n.toPrecision(10)))}
 function preview(){if(!expression||/[+\-*/]$/.test(expression)){const m=expression.match(/(?:^|[+*/-])(-?\d*\.?\d+)$/);return m?m[1]:'0'}try{return format(calculate(expression))}catch(e){if(e.message==='zero')return 'Error';const m=expression.match(/(-?\d*\.?\d+)$/);return m?m[1]:'0'}}
 function render(){exprEl.textContent=evaluated?(previous+' ='):expression?nice(expression):'READY';out.textContent=evaluated?expression:preview();out.style.fontSize=out.textContent.length>9?'23px':out.textContent.length>6?'27px':'30px';document.querySelectorAll('[data-op]').forEach(b=>b.classList.toggle('selected',!!expression&&/[+\-*/]$/.test(expression)&&expression.endsWith(b.dataset.op)))}
 $('open').addEventListener('click',()=>{home.hidden=true;calc.hidden=false;expression='';previous='';evaluated=false;render()});
 $('back').addEventListener('click',()=>{calc.hidden=true;home.hidden=false});
 function digit(v){if(evaluated){expression='';previous='';evaluated=false}if(v==='.'){const last=expression.split(/[+\-*/]/).pop();if(last.includes('.'))return;if(!last)expression+='0'}expression+=v;render()}
 function operator(op){if(evaluated){previous='';evaluated=false}if(!expression){if(op==='-')expression='-';else return}else if(/[+\-*/]$/.test(expression)){if(op==='-'&&/[+*/]$/.test(expression)){expression+='-';render();return}expression=expression.slice(0,-1)+op}else expression+=op;render()}
 function sign(){if(evaluated){evaluated=false;previous=''}const m=expression.match(/(\d*\.?\d+)$/);if(!m){if(!expression||/[+*/-]$/.test(expression))expression+='-';render();return}const start=m.index,neg=start>0&&expression[start-1]==='-'&&(start-1===0||/[+*/-]/.test(expression[start-2]));expression=neg?expression.slice(0,start-1)+m[1]:expression.slice(0,start)+'-'+m[1];render()}
 function equals(){if(!expression)return;try{const old=nice(expression);const answer=format(calculate(expression));previous=old;expression=answer;evaluated=true;render()}catch(e){out.textContent=e.message==='zero'?'Cannot ÷ 0':'Error';exprEl.textContent=nice(expression);evaluated=false}}
 function action(a){if(a==='clear'){expression='';previous='';evaluated=false;render()}else if(a==='del'){if(evaluated){expression='';previous='';evaluated=false}else expression=expression.slice(0,-1);render()}else if(a==='sign')sign();else if(a==='equals')equals()}
 document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>digit(b.dataset.v)));
 document.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click',()=>operator(b.dataset.op)));
 document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.a)));
 document.addEventListener('keydown',e=>{if(calc.hidden)return;if(/^\d$/.test(e.key)||e.key==='.')digit(e.key);else if(['+','-','*','/'].includes(e.key))operator(e.key);else if(e.key==='Enter'||e.key==='=')equals();else if(e.key==='Backspace')action('del');else if(e.key==='Escape')action('clear')});
 render();
})();
</script>
</body>
</html>
